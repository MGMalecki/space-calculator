<!DOCTYPE html>
<html lang="en">

<!-- The HEAD holds settings about the page. You don't see it on screen. -->
<head>
  <meta charset="UTF-8">
  <!-- This line makes the page fit a phone screen instead of looking tiny -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The name shown on the browser tab -->
  <title>Times Tables Game</title>

  <!-- The STYLE section decides how things look: colours, sizes, spacing -->
  <style>
    /* The whole page */
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fff8e7;   /* soft cream colour */
      color: #333;           /* dark grey text */
      padding: 20px;
    }

    /* The top row: level, stars and time, spread across the screen */
    .info {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
    }

    /* The big sum in the middle */
    #question {
      font-size: 56px;
      font-weight: bold;
      margin: 60px 0 30px;
    }

    /* The box where the child types the answer */
    #answer {
      font-size: 40px;
      width: 160px;
      text-align: center;
      border: 3px solid #f0a500;
      border-radius: 12px;   /* rounded corners */
    }

    /* The orange Check button */
    button {
      display: block;
      margin: 30px auto;     /* "auto" puts it in the middle */
      font-size: 28px;
      padding: 12px 40px;
      border: none;
      border-radius: 12px;
      background: #f0a500;
      color: white;
    }

    /* The message that says "Correct!" or "Oops!" */
    #feedback {
      font-size: 28px;
      min-height: 40px;      /* keeps space for it, so nothing jumps around */
    }
  </style>
</head>

<!-- The BODY is everything you actually see on the screen -->
<body>

  <!-- Top row: level, stars, seconds left -->
  <div class="info">
    <span>Level 1</span>
    <span>⭐ 0</span>
    <span id="timer">⏱️ 10</span>
  </div>

  <!-- The question. The id lets JavaScript change it later. -->
  <div id="question">6 × 7 = ?</div>

  <!-- inputmode="numeric" makes phones show the number keypad -->
  <input id="answer" type="text" inputmode="numeric">

  <button id="check">Check</button>

  <!-- Empty for now. JavaScript writes "Correct!" or "Oops!" here. -->
  <div id="feedback"></div>

  <!-- The SCRIPT is the brain of the game: JavaScript that makes things happen -->
  <script>
    // Find the parts of the page we want to control, using their ids
    const questionBox = document.getElementById("question");
    const answerBox = document.getElementById("answer");
    const checkButton = document.getElementById("check");
    const feedbackBox = document.getElementById("feedback");
    const timerBox = document.getElementById("timer");

    // Level 1 uses these times tables
    const tables = [1, 2, 3, 4, 5, 10];

    // Level 1 gives 10 seconds for each question
    const timeLimit = 10;

    // Here we remember the right answer to the current question
    let correctAnswer = 0;

    // Here we remember how many seconds are left
    let timeLeft = 0;

    // The ticking clock. We keep it so we can stop it later.
    let clock;

    // Starts the countdown again from the full time
    function startTimer() {
      clearInterval(clock);   // stop the old clock first, so we never have two
      timeLeft = timeLimit;
      timerBox.textContent = "⏱️ " + timeLeft;

      // setInterval runs the tick function again and again, every 1000 ms (1 second)
      clock = setInterval(tick, 1000);
    }

    // Runs once every second
    function tick() {
      timeLeft = timeLeft - 1;
      timerBox.textContent = "⏱️ " + timeLeft;

      // Time is up: this counts as a wrong answer
      if (timeLeft === 0) {
        feedbackBox.textContent = "Time's up! It was " + correctAnswer;
        feedbackBox.style.color = "red";
        newQuestion();
      }
    }

    // Gives a random whole number from 1 to max
    function randomNumber(max) {
      return Math.floor(Math.random() * max) + 1;
    }

    // Makes a new random question and shows it
    function newQuestion() {
      // Pick one table from the list, e.g. 4
      const a = tables[randomNumber(tables.length) - 1];
      // Pick a number from 1 to 10, e.g. 7
      const b = randomNumber(10);

      correctAnswer = a * b;
      questionBox.textContent = a + " × " + b + " = ?";

      answerBox.value = "";   // clear the old answer
      answerBox.focus();      // put the cursor in the box, ready to type

      startTimer();           // every new question gets a fresh countdown
    }

    // Runs when the child presses Check
    function checkAnswer() {
      // Do nothing if the box is empty
      if (answerBox.value === "") {
        return;
      }

      // The box holds text, so turn it into a number before comparing
      const childAnswer = Number(answerBox.value);

      if (childAnswer === correctAnswer) {
        feedbackBox.textContent = "Correct! 🎉";
        feedbackBox.style.color = "green";
      } else {
        feedbackBox.textContent = "Oops! It was " + correctAnswer;
        feedbackBox.style.color = "red";
      }

      newQuestion();
    }

    // When the button is clicked, check the answer
    checkButton.addEventListener("click", checkAnswer);

    // Pressing Enter on the keyboard also checks the answer
    answerBox.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        checkAnswer();
      }
    });

    // Show the very first question when the page opens
    newQuestion();
  </script>

</body>
</html>
