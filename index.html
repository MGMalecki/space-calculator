<!DOCTYPE html>
<html lang="en">

<!-- The HEAD holds settings about the page. You don't see it on screen. -->
<head>
  <meta charset="UTF-8">
  <!-- This line makes the page fit a phone screen instead of looking tiny -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The name shown on the browser tab -->
  <title>Times Tables Game</title>

  <!-- The STYLE section decides how things look: colours, sizes, spacing -->
  <style>
    /* The whole page */
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fff8e7;   /* soft cream colour */
      color: #333;           /* dark grey text */
      padding: 20px;
    }

    /* The top row: level, stars and time, spread across the screen */
    .info {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
    }

    /* The big sum in the middle */
    #question {
      font-size: 56px;
      font-weight: bold;
      margin: 60px 0 30px;
    }

    /* The box where the child types the answer */
    #answer {
      font-size: 40px;
      width: 160px;
      text-align: center;
      border: 3px solid #f0a500;
      border-radius: 12px;   /* rounded corners */
    }

    /* The orange Check button */
    button {
      display: block;
      margin: 30px auto;     /* "auto" puts it in the middle */
      font-size: 28px;
      padding: 12px 40px;
      border: none;
      border-radius: 12px;
      background: #f0a500;
      color: white;
    }
  </style>
</head>

<!-- The BODY is everything you actually see on the screen -->
<body>

  <!-- Top row: level, stars, seconds left -->
  <div class="info">
    <span>Level 1</span>
    <span>⭐ 0</span>
    <span>⏱️ 10</span>
  </div>

  <!-- The question. The id lets JavaScript change it later. -->
  <div id="question">6 × 7 = ?</div>

  <!-- inputmode="numeric" makes phones show the number keypad -->
  <input id="answer" type="text" inputmode="numeric">

  <button>Check</button>

</body>
</html>
